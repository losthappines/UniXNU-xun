#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0x5FC00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "none"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
base           = 0x00000000
kernel_offset  = 0x00008000
tags_offset    = 0x01f00000
pagesize       = 4096
