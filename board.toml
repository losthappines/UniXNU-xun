# Board description of the Lenovo Xiaoxin Pad 2022 (TB128FU, SM6225 bengal), read by the unixnu build driver.
#
# Prepared with the tablet under Android (TrebleDroid GSI, android-devinfo 2026-10-21). Nothing has been observed through
# UniXNU on a TB128FU yet. The memory banks, [userdata] and every SoC address were read from the running device tree.

[board]
name = "xun"
soc = "SM6225"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Pad SE 11\" (xun)"
kit = "xun"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]                    # a package/ of this repository would appear as kits/tb128fu in the build tree

# The same target OS image as UniXNU-sheng: the unchanged iPad7,1 iPadOS 17.7.11 restore image.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# Android's userdata (sda18 on the UFS LUN 0, 104.5 GiB), from the tablet's GPT, which agrees with sysfs. "unixnu build
# userdata" writes the image for it; flashing it erases Android's data. The windows are those of UniXNU-sheng: the same
# target image.
[userdata]
first_lba = 0x1332730
last_lba = 0xe8fffff
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[root]
os_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
systemos_volume_uuid = "8846FE78-2910-4297-AF97-D59BB6F8FC16"
os_image_sha256 = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
systemos_image_sha256 = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "xun_defconfig"
# Archive builders of the kernel step, in order; the ones xun_defconfig links. build-arm-driver.py is UniXNU's generic
# driver builder, which finds each component in UniXNU's components.toml.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py SoftwareAES",
  # NativeEmmc: Qualcomm SDHCI MSM (sdhci@4744000) for eMMC 5.1
  "build-xun-emmc.py",
  "build-software-aes-bindings.py",
  "build-libpthread-kernel.py",
  "build-link-stubs.py",
  "build-platform-power.py",
]

# The same original kernelcache and prelink selection as UniXNU-sheng: the target image is the same.
[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The firmware is the Mu-Silicium TB128FU port (tb128fuPkg, Divar SM6225) of the uefi-tb128fu checkout, with UniXNU,
# the ramdisk block device driver and DarwinBoot added. The stock ABL carries one statically linked LinuxLoader PE
# instead of separable vendor DXE modules, so the build uses the Mu driver set only (SimpleFbDxe on the ABL's
# cont_splash_region); there is no Binaries/tb128fu.
[firmware]
config = "xun"                 # Resources/Configs/xun.toml in the Mu-Silicium checkout (--uefi or UNIXNU_UEFI)
dsc = "Platforms/Xiaomi/xunPkg/xun.dsc"
fd = "Build/xunPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-xun.py"]   # reads the checkout from UNIXNU_UEFI
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# Masks a GIC interrupt that has no handler instead of taking it forever (found on sheng with a leftover IPCC interrupt).
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Lenovo",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Lenovo",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "xun-research"

# Image parameters come from Resources/Configs/xun.toml of the checkout. Resources/DTBs/xun.dtb carries
# /reserved-memory/cont_splash_region@5c000000, so no [[bootimg.dtb_node]] is added.
[bootimg.image]
kernel_compression = "none"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and the optional
# trust cache and Data seed. DarwinBoot is part of the firmware volume.
[payload]
volume = "XUNESP"
size_mib = 55
timeout = 2
loader = "firmware"
title = "xun first boot: source 4K XNU to the panic screen"
# DRAM base is 0x40000000. XNU spans from 0x40000000 across contiguous free DRAM.
dram_size = "0x180000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
skip_setup_args = ["--no-auto-dim", "--plain-framebuffer"]
panic_screen = true
entry_probe_reset_delay = 0
entry_probe_reset_after = "_arm_vm_init"
entry_probe_reset_before = false
# The original static/System trust caches of the same IPSW, as accepted by UniXNU-sheng.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# The generic arguments of the sheng image that apply to this kernel. sheng-pmgr=2 publishes the original PMGR nub
# through the bridge, which reads and writes no hardware. sheng-data-persist=2 keeps the 8 GiB packed Data seed writable
# through the userdata store window (a seed above 2 GiB has no volatile backing).
kernel_args = [
  "-v",
  "serial=0",
  "-progress",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  "armcpu-self-ipi=1",
  "armcpu-spi-ipi=1",
  "armcpu-spi-ipi-base=536",
  "armcpu-timer-intid=19",
  "sheng-pmgr=2",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "native-emmc-root=1",
  "native-emmc-diagnostics=2",
  "sheng-data-persist=2",
]

[payload.adt]
tool = "scripts/make-xun-adt.py"
chip_id = "207"
# 4 GiB, the iPad7,1's memory size (sheng, the board that runs iPadOS, owns 0x130000000). The firmware maps the free 0x80000000..0x1c0000000 run as one region. The first
# boots used 2 GiB: iPadOS reached SpringBoard with 97 processes, but free memory fell to about 5 MiB.
owned_memory_size = "0x80000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the OS volume of the same IPSW
# All eight cores (boot CPU 0 first): 0..3 Cortex-A53 (Kryo Silver), 0x100..0x103 Cortex-A73. ArmCpu starts the
# others with PSCI CPU_ON under sheng-smp=1; "0" keeps the boot CPU only.
# Bisecting a stall with all eight (2026-10-22: every core reached step 7, but user space stopped at launchd): first one
# more Cortex-A53 of the boot cluster (tb128fu-007: works, 84 processes at 181 s); then one Cortex-A73 (tb128fu-008:
# no deadlock, but the root verification ran about 3x slower and launchd was still reading at 180 s, as with all eight;
# the Cortex-A73 cluster is presumably left at a low clock without a CPU frequency driver). tb128fu-009: the four
# Cortex-A53 work. tb128fu-012's CpuFreq.c read the Cortex-A73 domain at 300 MHz (and not enabled while its cluster was off),
# the Cortex-A53s at 1516 MHz; with tb128fu-cpufreq=1 both ask for their top level, so all eight again.
# tb128fu-056 (experiment) started the boot Cortex-A53 and the four Cortex-A73 only: on one kernel cluster the render server's
# thread had committed 72% of its frames from a Cortex-A53, 53 ms of CPU per frame; with the A73s, 35 ms. tb128fu-058: all eight as
# two kernel clusters (cluster-type E/P, make-tb128fu-adt.py) under the Edge scheduler (package/xnu-patches/native-smp-type-clusters.patch,
# ArmCpu registers each core with its type): every frame from an A73, 36 ms of CPU per frame. (057/057b/059 failed only because the
# boot diagnostics were compiled against the previous build's struct layout: a kernel config change needs two builds.) The patch is
# this board's own: the same kernel with one cluster (no cluster-type, as on pipa and sheng) stopped early in user space (tb128fu-058c).
cpu_regs = "0,1,2,3,0x100,0x101,0x102,0x103"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository
