name: Build Xun iPadOS Port (UEFI & XNU)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: xun-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-uefi:
    name: Build Mu-Silicium UEFI (xunPkg)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out UniXNU-xun
        uses: actions/checkout@v4
        with:
          path: UniXNU-xun

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive

      - name: Check out Mu-Silicium
        uses: actions/checkout@v4
        with:
          repository: Project-Silicium/Mu-Silicium
          path: Mu-Silicium
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm uuid-dev acpica-tools \
            mtools dosfstools device-tree-compiler git python3 python3-pip

      - name: Scaffold & Verify xunPkg in Mu-Silicium
        run: |
          mkdir -p Mu-Silicium/Platforms/Xiaomi/xunPkg
          mkdir -p Mu-Silicium/Resources/Configs
          mkdir -p Mu-Silicium/Resources/DTBs
          if [ -d "UniXNU-xun/uefi/xunPkg" ]; then
            cp -r UniXNU-xun/uefi/xunPkg/* Mu-Silicium/Platforms/Xiaomi/xunPkg/
          fi
          if [ -d "UniXNU-xun/uefi/Resources" ]; then
            cp -r UniXNU-xun/uefi/Resources/* Mu-Silicium/Resources/
          fi
          if [ -d "UniXNU/package/UniXNUPkg" ]; then
            cp -r UniXNU/package/UniXNUPkg Mu-Silicium/
          fi
          if [ -d "UniXNU/drivers/DarwinBoot" ]; then
            cp -r UniXNU/drivers/DarwinBoot Mu-Silicium/DarwinBootPkg
          fi
          export UNIXNU_UEFI="$GITHUB_WORKSPACE/Mu-Silicium"
          find . -name "BootVideo.h" -exec sed -i 's/Video\[1\] = 1;/Video\[1\] = 0;/g' {} +
          python3 UniXNU-xun/scripts/patch-mu-sec-entryarg.py "$UNIXNU_UEFI"
          python3 UniXNU-xun/scripts/check-xun.py

      - name: Build UEFI Firmware Volume (SILICIUM_UEFI.fd)
        working-directory: UniXNU
        run: |
          python3 unixnu build firmware --uefi ../Mu-Silicium -D ../UniXNU-xun

      - name: Upload UEFI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xun-uefi
          path: |
            Mu-Silicium/Build/xunPkg/**/FV/SILICIUM_UEFI.fd
            UniXNU/out/**/*.fd
          if-no-files-found: warn

  build-xnu:
    name: Build 4K XNU Kernel & Device Tree (iPadOS 17.7.11)
    # macos-26 carries Xcode 26 / Clang 20+ required for -Wno-unnecessary-virtual-specifier
    runs-on: macos-26
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Check out UniXNU-xun
        uses: actions/checkout@v4
        with:
          path: UniXNU-xun

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive

      - name: Check out Mu-Silicium (Font.h for panic screen)
        uses: actions/checkout@v4
        with:
          repository: Project-Silicium/Mu-Silicium
          path: Mu-Silicium

      - name: Install Toolchain Tools
        run: |
          brew install llvm lld mtools dtc lzfse
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Select Xcode 26 & iphoneos SDK
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || echo /Applications/Xcode.app)
          echo "Using Xcode: $XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Generate Apple Device Trees (.adt)
        run: |
          mkdir -p UniXNU-xun/out/xun
          python3 UniXNU-xun/scripts/make-xun-adt.py --dram-size 0x180000000 --ipad-identity --root-match-volume-uuid 04769D26-2CA0-4825-B443-E2E5F88300F2 --output UniXNU-xun/out/xun/xun-single.adt --cpu-regs 0
          python3 UniXNU-xun/scripts/make-xun-adt.py --dram-size 0x180000000 --ipad-identity --root-match-volume-uuid 04769D26-2CA0-4825-B443-E2E5F88300F2 --output UniXNU-xun/out/xun/xun-smp.adt --cpu-regs 0,1,2,3,0x100,0x101,0x102,0x103
          python3 UniXNU-xun/scripts/inspect-adt.py UniXNU-xun/out/xun/xun-single.adt
          python3 UniXNU-xun/scripts/inspect-adt.py UniXNU-xun/out/xun/xun-smp.adt --smp

      - name: Configure & Build XNU Kernel (MACHINE_CONFIGS=BCM2837)
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UEFI: ${{ github.workspace }}/Mu-Silicium
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-xnu-4k-baseline.sh')
          text = p.read_text()
          old = '{ [ "${XNU_NATIVE_VIRTIO_BLOCK:-0}" != 1 ] && [ "${XNU_SOURCE_STORAGE:-0}" != 1 ]; }'
          new = '{ [ "${XNU_NATIVE_VIRTIO_BLOCK:-0}" != 1 ] && [ "${XNU_SOURCE_STORAGE:-0}" != 1 ] && [ "${XNU_NATIVE_UFS:-0}" != 1 ]; }'
          assert old in text, 'Expected OWNER_ROOT_TRUST guard not found in build-xnu-4k-baseline.sh'
          p.write_text(text.replace(old, new, 1))
          PY
          python3 unixnu ipsw fetch KernelCache OS -D ../UniXNU-xun
          python3 unixnu defconfig xun_defconfig -D ../UniXNU-xun
          python3 ../UniXNU-xun/scripts/make-xun-data-seed.py --output out/xun-data.dbr --device ../UniXNU-xun --unixnu . --config auto
          python3 unixnu build kernel -D ../UniXNU-xun
          # Second pass links the real ShengPlatformPower.cpp against pass-1's kernel.macho instead of FirstPassStub.c.
          python3 unixnu build kernel -D ../UniXNU-xun

      - name: Fetch Trust Caches & Build Payload Volume (payload.img)
        working-directory: UniXNU
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/Mu-Silicium
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          python3 unixnu ipsw fetch StaticTrustCache Cryptex1,SystemTrustCache -D ../UniXNU-xun
          python3 - <<'PY'
          import hashlib, struct, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import im4p_payload
          ipsw_dir = Path('out/ipsw/21H461')
          static_tc = im4p_payload((ipsw_dir / '044-76040-038.dmg.trustcache').read_bytes())
          system_tc = im4p_payload((ipsw_dir / '044-76034-038.dmg.trustcache').read_bytes())
          bundle = struct.pack('<3I', 2, 12, 12 + len(static_tc)) + static_tc + system_tc
          sha = hashlib.sha256(bundle).hexdigest()
          expected = '7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7'
          assert sha == expected, f'Trust cache bundle hash mismatch: {sha} != {expected}'
          Path('out/original-static-system.bundle').write_bytes(bundle)
          print(f'Staged trust cache bundle ({len(bundle)} bytes, sha256 {sha})')
          PY
          python3 unixnu build payload -D ../UniXNU-xun --trust-cache out/original-static-system.bundle --data-ramdisk out/xun-data.dbr --skip-setup

      - name: Upload Kernel, Payload & ADT Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xun-kernel-payload
          path: |
            UniXNU/out/**/kernel.macho
            UniXNU/out/**/kernel/kernel.*
            UniXNU/out/**/payload/payload.img
            UniXNU/out/**/payload/payload.json
            UniXNU-xun/out/xun/*.adt
          if-no-files-found: warn

  package-bootimg:
    name: Package Android Boot Image (boot.img)
    needs: [build-uefi, build-xnu]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out UniXNU-xun
        uses: actions/checkout@v4
        with:
          path: UniXNU-xun

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive

      - name: Check out Mu-Silicium
        uses: actions/checkout@v4
        with:
          repository: Project-Silicium/Mu-Silicium
          path: Mu-Silicium

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm device-tree-compiler python3

      - name: Download UEFI & Payload Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - name: Stage Mu-Silicium Resources & Assemble boot.img
        working-directory: UniXNU
        run: |
          cp -r ../UniXNU-xun/uefi/Resources/* ../Mu-Silicium/Resources/
          FD_PATH=$(find ../ci-artifacts/xun-uefi -name 'SILICIUM_UEFI.fd' | head -n 1)
          RAMDISK_PATH=$(find ../ci-artifacts/xun-kernel-payload -name 'payload.img' | head -n 1)
          echo "Using FD: $FD_PATH"
          echo "Using Ramdisk: $RAMDISK_PATH"
          test -f "$FD_PATH"
          test -f "$RAMDISK_PATH"
          mkdir -p ../out/xun
          python3 ../UniXNU-xun/scripts/make-xun-bootimg.py \
            --fd "$FD_PATH" \
            --dtb ../Mu-Silicium/Resources/DTBs/xun.dtb \
            --ramdisk "$RAMDISK_PATH" \
            -o ../out/xun/boot.img
          SIZE=$(wc -c < ../out/xun/boot.img)
          echo "boot.img size: $SIZE bytes"
          python3 -c "import sys; s=$SIZE; limit=64*1024*1024; print(f'Size check: {s} / {limit} ({s/1048576:.2f} MiB)'); sys.exit(0 if s <= limit else 1)"

      - name: Upload Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xun-bootimg
          path: |
            out/xun/boot.img
            out/xun/boot.json
            ci-artifacts/xun-kernel-payload/**/payload.json
          if-no-files-found: error
